name: Build and Push Docker Image

# 构建 SenseVoice 双 GPU 镜像（RTX 4090 + RTX 5090）并推送到 siliconflow 镜像仓库
# 参考：siliconflow/vllm_agent 的 docker-build.yml
#
# Tag 规则：{YYYYMMDD}-v{VERSION}-{gpu}，VERSION 来自 VERSION 文件
#   例如：20260825-v1.0.1-rtx5090
#
# 触发方式：
#   - workflow_dispatch：手动触发（ Review 通过后使用）
#   - push 到 main：合并 PR 时自动构建

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建（跳过 tag 存在性检查）'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: hub.6scloud.com
  NAMESPACE: clxuaivn500083i7ncuxpw8cf
  IMAGE_NAME: sensevoice

jobs:
  build-and-push:
    name: Build ${{ matrix.gpu }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个 GPU 失败不影响另一个继续构建
      matrix:
        include:
          - gpu: rtx4090
            torch_version: "2.5.1"
            torch_index: cu124
          - gpu: rtx5090
            torch_version: "2.7.0"
            torch_index: cu128

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: VERSION file is empty"
            exit 1
          fi
          DATE_TAG=$(date -u +%Y%m%d)
          FULL_TAG="${DATE_TAG}-v${VERSION}-${{ matrix.gpu }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
          echo "========================================"
          echo "GPU        : ${{ matrix.gpu }}"
          echo "Torch      : ${{ matrix.torch_version }}"
          echo "CUDA index : ${{ matrix.torch_index }}"
          echo "Tag        : $FULL_TAG"
          echo "========================================"

      - name: Check if image already exists
        id: check_existing
        if: ${{ github.event.inputs.force_build != 'true' }}
        continue-on-error: true
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "Checking existing image: $FULL_IMAGE"
          if skopeo inspect "docker://$FULL_IMAGE" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Image already exists: $FULL_IMAGE. Skip building. (Use force_build=true to override)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag is unique, proceeding with build."
          fi

      - name: Skip build if image exists
        if: ${{ steps.check_existing.outputs.exists == 'true' }}
        run: |
          echo "Image already exists, skipping build."
          exit 0

      - name: Set up QEMU
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SILICONFLOW_REGISTRY_USERNAME }}
          password: ${{ secrets.SILICONFLOW_REGISTRY_PASSWORD }}

      - name: Build and push
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}
          build-args: |
            TORCH_VERSION=${{ matrix.torch_version }}
            TORCH_INDEX_URL=https://download.pytorch.org/whl/${{ matrix.torch_index }}
            USE_ALIYUN_MIRROR=false
          cache-from: type=gha,scope=${{ matrix.gpu }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gpu }}

      - name: Print image info
        if: ${{ steps.check_existing.outputs.exists != 'true' }}
        run: |
          echo "========================================"
          echo "Build completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full_tag }}"
          echo "========================================"
