name: Sync upstream

# 自动同步上游 FunAudioLLM/SenseVoice 的 main 分支到适配分支
# 如果有新提交，创建 PR（自动解决 Dockerfile 冲突 + bump VERSION）
# PR 合并后 docker-build.yml 会自动触发构建并推送镜像
#
# 触发方式：
#   - schedule: 每天 UTC 02:00（北京时间 10:00）检查一次
#   - workflow_dispatch: 手动触发

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅检查不创建 PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: FunAudioLLM/SenseVoice
  UPSTREAM_BRANCH: main
  ADAPTATION_BRANCH: feat/sf-gpu-function-adaptation
  # 上游新增但不适用于本适配分支的文件（Dockerfile 契约不同），空格分隔
  DROP_PATHS: ".github/workflows/sensevoice-container.yml tests/test_container_contract.py"

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
    steps:
      - name: Checkout adaptation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADAPTATION_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream ${{ env.UPSTREAM_BRANCH }} --tags

      - name: Check for new upstream commits
        id: check
        run: |
          MERGE_BASE=$(git merge-base ${{ env.ADAPTATION_BRANCH }} upstream/${{ env.UPSTREAM_BRANCH }})
          UPSTREAM_HEAD=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          NEW_COMMITS=$(git rev-list --count ${MERGE_BASE}..${UPSTREAM_HEAD})

          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"

          if [[ "$NEW_COMMITS" -gt 0 ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found $NEW_COMMITS new upstream commits"
            git log --oneline ${MERGE_BASE}..${UPSTREAM_HEAD} | head -20
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new upstream commits"
          fi

      - name: Bump VERSION
        if: steps.check.outputs.has_updates == 'true' && inputs.dry_run != 'true'
        id: bump
        run: |
          CURRENT=$(tr -d '[:space:]' < VERSION)
          # 语义化版本 patch 自增（1.0.4 → 1.0.5）
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Version bump: $CURRENT → $NEW_VERSION"

      - name: Commit and push
        if: steps.check.outputs.has_updates == 'true' && inputs.dry_run != 'true'
        run: |
          # 创建临时同步分支
          SYNC_BRANCH="sync/upstream-${{ steps.check.outputs.upstream_head }}"
          git checkout -b "$SYNC_BRANCH"

          # merge 上游，Dockerfile 冲突自动保留我们的版本（-X ours）
          # 上游可能新增的不适用文件（sensevoice-container.yml、test_container_contract.py）
          # 通过 merge 后的清理步骤删除
          git merge upstream/${{ env.UPSTREAM_BRANCH }} \
            --no-edit \
            -X ours \
            -m "Merge upstream ${{ env.UPSTREAM_REPO }}@${{ steps.check.outputs.upstream_head }}"

          # 删除上游新增但不适用于本适配分支的文件
          for path in ${{ env.DROP_PATHS }}; do
            if [[ -f "$path" ]]; then
              git rm -f "$path"
              echo "::notice::Dropped $path (incompatible with adaptation branch)"
            fi
          done

          # 提交 VERSION bump 和文件清理
          git add VERSION
          git commit -m "chore: bump VERSION to ${{ steps.bump.outputs.version }} after upstream sync" \
            --allow-empty

          # 推送到 origin（force-with-lease 覆盖已有同名分支，支持重复运行时更新）
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Create or update Pull Request
        if: steps.check.outputs.has_updates == 'true' && inputs.dry_run != 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="sync/upstream-${{ steps.check.outputs.upstream_head }}"

          BODY=$(cat <<'PR_BODY'
          ## Summary

          自动同步上游 `${{ env.UPSTREAM_REPO }}@${{ steps.check.outputs.upstream_head }}` 到适配分支。

          上游新增 **${{ steps.check.outputs.new_commits }} commits**（自上次同步点 `${{ steps.check.outputs.merge_base }}` 起）。

          ### 自动处理
          - Dockerfile 冲突自动保留适配分支版本（多阶段构建支持 4090/5090 双 GPU）
          - 删除上游新增但不适用文件：`sensevoice-container.yml`、`tests/test_container_contract.py`
          - VERSION bump 到 `${{ steps.bump.outputs.version }}`

          ### 需要人工 Review
          - 上游新增的代码文件（如 *.py）是否与适配分支的修改冲突
          - requirements.txt 是否引入不兼容的依赖版本

          ### 后续
          PR 合并后 `docker-build.yml` 会自动触发双 GPU 镜像构建并推送。

          PR_BODY
          )

          # 检查是否已有针对该分支的 open PR
          EXISTING_PR=$(gh pr list \
            --base "${{ env.ADAPTATION_BRANCH }}" \
            --head "${{ github.repository_owner }}:${SYNC_BRANCH}" \
            --state open \
            --json url --jq '.[0].url' 2>/dev/null || true)

          if [[ -n "$EXISTING_PR" ]]; then
            echo "::notice::PR already exists: $EXISTING_PR"
            echo "pr_url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --base "${{ env.ADAPTATION_BRANCH }}" \
              --head "$SYNC_BRANCH" \
              --title "sync: upstream ${{ env.UPSTREAM_REPO }} (${{ steps.check.outputs.new_commits }} new commits)" \
              --body "$BODY" 2>&1 || true)
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "::notice::Created PR: $PR_URL"
          fi

      - name: Dry run summary
        if: inputs.dry_run == 'true' && steps.check.outputs.has_updates == 'true'
        run: |
          echo "::notice::Dry run: ${{ steps.check.outputs.new_commits }} new upstream commits found, no PR created"
