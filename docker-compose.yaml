name: sensevoice

services:
  sensevoice-api:
    container_name: sensevoice-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 基础配置
      # 设备选择：cuda/cpu/auto
      SENSEVOICE_DEVICE: ${SENSEVOICE_DEVICE:-cuda}
      # 模型名称
      MODEL_NAME: ${MODEL_NAME:-iic/SenseVoiceSmall}
      # 模型缓存目录
      MODELSCOPE_CACHE: /models
      # Python 环境变量
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      # 临时文件目录
      TEMP_DIR: /tmp/sensevoice
      # 日志目录
      LOG_DIR: /app/logs

      # ========== 模型预加载策略 ==========
      # PRELOAD_MODEL: 是否预加载模型到内存 (1=是，0=否，首次请求时加载)
      # 首次部署建议设为 1，容器启动时会下载模型并加载到内存
      PRELOAD_MODEL: ${PRELOAD_MODEL:-1}

      # PRELOAD_MODEL_ON_START: 是否在启动时预下载模型到本地缓存 (1=是，0=否)
      # 设为 1 可在启动时主动下载模型（利用 SiliconFlow 缓存加速）
      # PRELOAD_MODEL_ON_START: ${PRELOAD_MODEL_ON_START:-0}

      # ONLY_PRELOAD: 设为 1 仅下载模型，不启动服务（用于离线构建镜像）
      # ONLY_PRELOAD: ${ONLY_PRELOAD:-0}
    volumes:
      # 模型缓存卷
      - sensevoice-models:/models
      # 日志卷（可选持久化）
      - sensevoice-logs:/app/logs
    ports:
      # 主 API 服务端口
      - "${API_PORT:-8000}:8000"
      # Prometheus metrics 端口（可选择暴露）
      # - "9090:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - default

  # 多副本部署（用于高并发场景）
  sensevoice-api-scaler:
    container_name: sensevoice-api-scaler
    image: sensevoice-api:latest
    environment:
      SENSEVOICE_DEVICE: cuda
      MODEL_NAME: iic/SenseVoiceSmall
      MODELSCOPE_CACHE: /models
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      LOG_DIR: /app/logs
      PRELOAD_MODEL: 1
    volumes:
      - sensevoice-models:/models
    ports:
      - "${API_PORT:-8001}:8000"
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - scale

volumes:
  sensevoice-models:
    driver: local
  sensevoice-logs:
    driver: local

networks:
  default:
    name: sensevoice-network