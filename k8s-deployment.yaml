# SenseVoice K8s 部署配置示例
# 包含优雅退出、健康检查、资源限制等最佳实践

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensevoice
  labels:
    app: sensevoice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # 确保滚动更新期间服务不中断
  selector:
    matchLabels:
      app: sensevoice
  template:
    metadata:
      labels:
        app: sensevoice
    spec:
      # 关键：优雅退出超时时间，必须大于应用内部超时
      terminationGracePeriodSeconds: 35

      containers:
      - name: api
        image: hub.6scloud.com/clxuaivn500083i7ncuxpw8cf/sensevoice:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 50000
          name: http

        env:
        - name: SENSEVOICE_DEVICE
          value: "cuda"
        - name: MODEL_NAME
          value: "iic/SenseVoiceSmall"
        - name: MODELSCOPE_CACHE
          value: "/models"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: TEMP_DIR
          value: "/tmp/sensevoice"
        - name: LOG_DIR
          value: "/app/logs"
        # 关键：优雅退出超时配置
        - name: GRACEFUL_SHUTDOWN_TIMEOUT
          value: "30"
        # 大文件处理配置
        - name: LARGE_FILE_THRESHOLD_MB
          value: "50"
        - name: TEMP_FILE_CLEANUP_DELAY
          value: "300"

        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: "1"

        # 关键：存活检查 - 简单快速
        livenessProbe:
          httpGet:
            path: /health
            port: 50000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # 关键：就绪检查 - 必须真实反映服务响应能力
        readinessProbe:
          httpGet:
            path: /ready
            port: 50000
          initialDelaySeconds: 120  # 给模型加载预留足够时间
          periodSeconds: 10
          timeoutSeconds: 30        # 推理测试可能需要较长时间
          failureThreshold: 3
          successThreshold: 1

        # 关键：优雅退出生命周期钩子
        lifecycle:
          preStop:
            exec:
              # 延迟 5 秒，确保 K8s 从 Service 端点列表中移除 Pod
              command: ["/bin/sh", "-c", "sleep 5"]

        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: tmp
          mountPath: /tmp/sensevoice
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: sensevoice-models
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sensevoice
  labels:
    app: sensevoice
spec:
  selector:
    app: sensevoice
  ports:
  - port: 80
    targetPort: 50000
    name: http
  type: ClusterIP

---
# 可选：PodDisruptionBudget 确保更新期间最小可用副本数
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sensevoice
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sensevoice
